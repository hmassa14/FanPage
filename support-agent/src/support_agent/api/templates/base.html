<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{% block title %}support-agent{% endblock %}</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1b1f24}
 header{background:#1b1f24;color:#fff;padding:.7rem 1.2rem;display:flex;gap:1.5rem;align-items:center}
 header a{color:#fff;text-decoration:none;font-weight:600} header small{opacity:.7}
 main{max-width:1100px;margin:1.2rem auto;padding:0 1rem}
 table{border-collapse:collapse;width:100%;background:#fff;font-size:.92rem}
 th,td{padding:.45rem .6rem;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}
 .pill{display:inline-block;padding:.1rem .5rem;border-radius:999px;font-size:.78rem;font-weight:600}
 .awaiting_approval{background:#fff3cd;color:#7a5a00} .sent,.approved{background:#d1fae5;color:#065f46}
 .escalated{background:#fee2e2;color:#991b1b} .rejected{background:#e5e7eb;color:#374151}
 .failed{background:#fecaca;color:#7f1d1d} .processing,.received{background:#dbeafe;color:#1e40af}
 .card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:1rem;margin-bottom:1rem}
 pre{white-space:pre-wrap;background:#f3f4f6;padding:.7rem;border-radius:6px;font-size:.85rem}
 textarea,input[type=text]{width:100%;box-sizing:border-box;font:inherit;padding:.4rem}
 button{font:inherit;padding:.45rem .9rem;border-radius:6px;border:1px solid #d1d5db;background:#fff;cursor:pointer}
 button.primary{background:#065f46;color:#fff;border-color:#065f46} button.danger{color:#991b1b}
 .reason{margin:.15rem 0} .block{color:#92400e} .escalate,.reject{color:#991b1b} .info{color:#065f46}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem} @media(max-width:800px){.grid{grid-template-columns:1fr}}
 .stat{display:inline-block;margin-right:1.2rem} .stat b{font-size:1.3rem}
</style></head>
<body><header><a href="/">support-agent</a><a href="/scorecard" style="font-weight:400">scorecard</a><small>{% block subtitle %}{% endblock %}</small>
<span style="margin-left:auto;opacity:.8">{{ user }}</span></header>
<main>{% block content %}{% endblock %}</main></body></html>
