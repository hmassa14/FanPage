services:
  api:
    build: .
    env_file: .env
    environment:
      SA_DB_PATH: /data/support_agent.sqlite3
      SA_INBOX_DIR: /data/inbox
      SA_OUTBOX_DIR: /data/outbox
      SA_OTEL_EXPORTER: otlp
      SA_OTEL_ENDPOINT: http://jaeger:4318
    volumes: ["agent-data:/data"]
    ports: ["8000:8000"]
    depends_on: [jaeger]
  worker:
    build: .
    env_file: .env
    environment:
      SA_DB_PATH: /data/support_agent.sqlite3
      SA_INBOX_DIR: /data/inbox
      SA_OUTBOX_DIR: /data/outbox
      SA_OTEL_EXPORTER: otlp
      SA_OTEL_ENDPOINT: http://jaeger:4318
    volumes: ["agent-data:/data"]
    command: ["support-agent", "worker"]
    depends_on: [api, jaeger]
  jaeger:
    # Trace UI at http://localhost:16686 ; accepts OTLP on 4318 (http) and 4317 (grpc)
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]
volumes:
  agent-data: {}
